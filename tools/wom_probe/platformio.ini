; Throwaway hardware probe: is the QMI8658's interrupt wired to an RTC GPIO,
; so that wake-on-motion can wake the chip from deep sleep? (docs/notes/low-power-2026-10-18.md)
;   pio run -d tools/wom_probe -t upload --upload-port /dev/ttyACM0
; It writes the bootloader, the partition table, otadata and app0 only: the
; pet's partitions are untouched. Reflash the real firmware afterwards.
[env:probe]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = ../partitions_16mb.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
