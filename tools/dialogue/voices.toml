# Hybrids for the sample generation. Genetics can cross any two voices; these
# are the pairs generated now. Order matters only for the prompt (A leads).
# A hybrid's registry voice is "<A>_x_<B>" in registry names, e.g. mystic_x_hoarder;
# its lines reach the device once voices.def has that row.
[blends]
pairs = [
  ["mystic", "paranoid_hoarder"],
  ["cheerful_doom", "ominous"],
  ["terse", "rambling"],
  ["forecast", "mystic"],
  ["ominous", "paranoid_hoarder"],
  ["rambling", "cheerful_doom"],
]

# Words from SOUL.md's Peter section seasoned into the seeds above. Only used
# to report which generated lines carry that seasoning (samples.md).
[seasoning]
markers = ["BROTHER", "DU+DE", "FOR+ SUR+", "AZERBAIJAN", "TELEPORT", "PROCESSING", "FENCE", "PAWN", "SCHEME", "TOMORROW GRUNGO", "CUTTING", "TRANCE", "CAMPOUT", "CINEMA", "DANCING", "PEACE BE", "A+HA+HA", "YES{3,}", "LOOKOUT", "ROLLS UP", "FRIEND"]

