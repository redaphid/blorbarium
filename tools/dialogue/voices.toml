# Grungo's hand-written voice corpus. generate.py builds every prompt from this
# file: a page of "The Field Notebook of a Pond Seer" headed by a word cloud
# (voice cloud + topic cloud) and seed sayings, left open for the model to
# continue. Seeds follow SOUL.md: third person, lowercase, one CAPITAL word.
# The device font is uppercase, so the filter folds case later.
#
# Each voice also draws a few words from lexicon.json (mined from sporefall-art)
# into its cloud, weighted by its `flavour` table: group name -> weight.
#
# Output goes to thought_lines.def, keyed by the thoughts registry's rows
# (thoughts.def) and voices (voices.def). A voice maps to the registry voice
# named by `registry` (default: its own name). A topic maps to the rows in
# `rows`, or, without `rows`, to every prophecy row of the same-named topic
# whose condition is `anytime`, since a generated line knows no condition.

