# blorbarium: one creature engine (lib/blorb), one renderer (lib/paint), four
# ways to run them. `native` is the host test suite, `sim` the SDL simulator
# (both in WSL survivor), and the two badges are the device firmware.
[platformio]
default_envs = badge128

[env:native]
platform = native
test_framework = googletest
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror=narrowing
    -O2
    -Itest/support
    -I$PROJECT_DIR/pets
    -Ipets/grungo
    # lib/ota checks real signatures natively with OpenSSL (src/crypto.cpp)
    -lcrypto

# The same suites at -O1 under ASan and UBSan, so optimisation never hides
# undefined behaviour that would break bit-identical replay:
#   wsl -d survivor --exec env PIO_ENV=native_san bash tools/wsl_test.sh [suite]
[env:native_san]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O1
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
extra_scripts = post:tools/sanitize_link.py

# The SDL simulator: sim/sim.cpp includes src/main.cpp, so it runs the
# firmware loop with the board swapped for a window (sim/board_sim.h).
#   wsl -d survivor --exec bash tools/sim_film.sh    builds it and checks the frame goldens
[env:sim]
platform = native
lib_deps =
    lovyan03/LovyanGFX@1.2.29
extra_scripts = pre:sim/find_sdl.py
build_src_filter = -<*> +<../sim/sim.cpp>
build_flags =
    -std=c++17
    -Werror=narrowing
    -O2
    -DBADGE_BOARD_SIM
    -Isim
    -Isrc
    -I$PROJECT_DIR/pets
    -Ipets/grungo
    -Itest/support

# The duel screen alone: tools/duel_shot.cpp draws one moment of a duel, or a
# whole scripted duel as frames, for tools/duel_sheet.py and the duel goldens.
#   wsl -d survivor --exec bash tools/duel_film.sh    builds it and checks them
[env:duelshot]
platform = native
build_src_filter = -<*> +<../tools/duel_shot.cpp>
build_flags =
    -std=c++17
    -Werror=narrowing
    -O2
    -I$PROJECT_DIR/pets
    -Ipets/grungo
    -Itest/support

# What the two ESP32 boards share. LovyanGFX is exact, not ^: a golden image is
# this library's pixels, so a release must not move one under a test.
[esp32]
platform = espressif32@6.9.0   ; Arduino 2.0.17 / IDF 4.4.7, what the released images and the field pets were built with; an unpinned platform once built on a Tasmota IDF 4.4.5 whose LittleFS could not mount petfs (every badge booted Sealed)
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@1.2.29
    h2zero/NimBLE-Arduino@^2.3.0
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = tools/partitions_16mb.csv
# The S3 core forces gnu++11; fixed.h and registry.h need 17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Werror=narrowing
    -I$PROJECT_DIR/pets
    -Ipets/grungo
# merge_image is post: it needs the offsets the platform works out while it builds.
extra_scripts =
    pre:tools/pick_port.py
    pre:tools/fw_stamp.py
    pre:tools/strip_paths.py
    post:tools/merge_image.py

# The Waveshare ESP32-S3-LCD-1.28: 240x240 GC9A01, a CH343 bridge on USB.
# Its PSRAM is unverified: this env declares quad PSRAM, DESIGN.md section 8
# budgets for none. Unit 20 prints ESP.getPsramSize() and settles it.
[env:badge128]
extends = esp32
board_build.arduino.memory_type = qio_qspi
custom_usb_id = 1A86:55D3
build_flags =
    ${esp32.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0

# The Waveshare ESP32-S3-Touch-LCD-1.46: 412x412 SPD2010 over QSPI, 8MB octal PSRAM.
[env:badge146]
extends = esp32
board_build.arduino.memory_type = qio_opi
custom_usb_id = 303A:1001
build_flags =
    ${esp32.build_flags}
    -DBADGE_BOARD_LCD146
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLGFX_USE_QSPI

# The 1.28 on Arduino 2.0.17 rebuilt with power management (tools/pm_framework.sh):
# in low power the chip light-sleeps and Bluetooth modem-sleeps (docs/power.md,
# "Light sleep"). The same sources as badge128 in every other respect; build the
# framework once with `bash tools/pm_framework.sh`.
[env:badge128_pm]
extends = env:badge128
platform_packages =
    framework-arduinoespressif32 @ symlink://${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32-pm
